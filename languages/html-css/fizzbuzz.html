<!doctype html>
<meta charset="utf-8">
<title>FizzBuzz in pure CSS</title>
<!--
  No JavaScript. A CSS counter walks 1..100 and :nth-child() rules decide
  which label each row gets. The number itself comes from counter().
-->
<style>
  ol { counter-reset: n; list-style: none; padding: 0; font-family: monospace; }
  li { counter-increment: n; }
  li::before { content: counter(n); }
  li:nth-child(3n)::before  { content: "Fizz"; }
  li:nth-child(5n)::before  { content: "Buzz"; }
  li:nth-child(15n)::before { content: "FizzBuzz"; }
</style>
