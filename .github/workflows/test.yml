name: Test

# Manual only. This installs a large set of compilers and interpreters, so
# running it on every push would burn through the runner-minute allowance for
# very little signal -- the implementations do not change on their own.
on:
  workflow_dispatch:
    inputs:
      languages:
        description: >-
          Space-separated languages to test (e.g. "python c rust").
          Leave empty to run everything.
        required: false
        default: ""
      verbose:
        description: "Show a diff for each failure"
        type: boolean
        required: false
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchains
        run: |
          sudo apt-get update
          # Installed one at a time: apt is atomic, so a single package that is
          # unavailable on the runner image would otherwise drop all of them.
          packages=(
            gnat gnucobol4 sbcl clisp guile-3.0 gforth ghc ocaml-nox
            gfortran fp-compiler mono-mcs mono-runtime scala groovy
            lua5.4 tcl sqlite3 gawk r-base-core swi-prolog octave
            regina-rexx icont iconx nasm wabt emacs-nox zsh fish
            bc dc m4 xsltproc jsonnet
          )
          for p in "${packages[@]}"; do
            sudo apt-get install -y --no-install-recommends "$p" \
              || echo "::warning::could not install $p"
          done

      - name: Show what is available
        run: |
          echo "### Toolchains" >> "$GITHUB_STEP_SUMMARY"
          for c in gcc g++ rustc go python3 ruby perl php node java; do
            printf '%s: %s\n' "$c" "$(command -v "$c" || echo missing)" \
              >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Run the suite
        env:
          VERBOSE: ${{ inputs.verbose && '1' || '' }}
        run: |
          # Unquoted on purpose: an empty input must expand to no arguments.
          tools/run-all.sh ${{ inputs.languages }} | tee /tmp/results.txt

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Results"
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' /tmp/results.txt | tail -5
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
